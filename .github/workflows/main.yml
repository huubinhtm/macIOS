name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download ios.rar
        run: |
          curl -fL \
            -o ios.rar \
            "https://github.com/huubinhtm/macIOS/releases/download/v1/ios.rar"

      - name: Check archive
        run: |
          ls -lh ios.rar
          file ios.rar

      - name: Install unar
        run: |
          brew install unar

      - name: Extract iOS project
        run: |
          mkdir -p ios
          unar -f -o ios ios.rar

      - name: Show extracted files
        run: |
          echo "===== ROOT ====="
          ls -lah ios

          echo "===== XCODE PROJECT ====="
          find ios -maxdepth 4 -name "*.xcodeproj"

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Build Xcode project
        working-directory: ios/ios
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Find built app
        working-directory: ios/ios
        run: |
          echo "===== BUILD PRODUCTS ====="
          find build/Build/Products \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print

      - name: Create IPA
        working-directory: ios/ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Lucidream.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Lucidream.app not found!"
            echo "Available app bundles:"
            find build/Build/Products -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Lucidream.app

          rm -f Lucidream.ipa
          zip -r -y Lucidream.ipa Payload

          echo "===== IPA CREATED ====="
          ls -lh Lucidream.ipa

          echo "===== IPA CONTENT ====="
          unzip -l Lucidream.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lucidream-ipa
          path: ios/ios/Lucidream.ipa
          if-no-files-found: error
          retention-days: 7
```
