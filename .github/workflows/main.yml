name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download ios.rar
        run: |
          curl -L \
            -o ios.rar \
            "https://github.com/huubinhtm/macIOS/releases/download/v1/ios.rar"

      - name: Check archive
        run: |
          ls -lh ios.rar
          file ios.rar

      - name: Install unar
        run: |
          brew install unar

      - name: Extract iOS project
        run: |
          mkdir -p ios
          unar -f -o ios ios.rar

      - name: Show extracted files
        run: |
          echo "===== ROOT ====="
          ls -lah ios

          echo "===== XCODE PROJECT ====="
          find ios -maxdepth 4 -name "*.xcodeproj"

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Build Xcode project
        working-directory: ios/ios
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Find built app
        working-directory: ios/ios
        run: |
          echo "===== BUILD PRODUCTS ====="
          find build/Build/Products -maxdepth 3 -type d -name "*.app" -print

      - name: Create IPA
        working-directory: ios/ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LucidDream.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: LucidDream.app not found!"
            exit 1
          fi

          mkdir -p Payload
          rm -rf Payload/LucidDream.app

          cp -R "$APP_PATH" Payload/LucidDream.app

          rm -f LucidDream.ipa
          zip -r -y LucidDream.ipa Payload

          echo "===== IPA CREATED ====="
          ls -lh LucidDream.ipa

          echo "===== IPA CONTENT ====="
          unzip -l LucidDream.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LucidDream-ipa
          path: ios/ios/LucidDream.ipa
          retention-days: 7
